tools:
  - class_name: "verl_trace2skill.local_bash_tool.LocalBashTool"
    config:
      type: native
      timeout: 20
      max_output_chars: 6000
      default_cwd: "."
      sandbox: true
    tool_schema:
      type: "function"
      function:
        name: "bash"
        description: "Run a bash command in the task workspace and return stdout, stderr, and return code."
        parameters:
          type: "object"
          properties:
            command:
              type: "string"
              description: "The bash command to execute."
          required: ["command"]
